<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetroSafe Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Hero Section with Interactive Image -->
  <div class="hero-container">
    <!-- Hero Image -->
    <div class="hero-image"></div>
    <!-- Hotspot: MetroSafe T-Shirt -->
    <div class="hotspot" id="hotspot-shirt" style="top: 55%; left: 15%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="shirt.png" alt="MetroSafe T-Shirt" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe T-Shirt</div>
          <div class="popup-price">$25.00</div>
          <button class="add-to-cart" data-product="shirt">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Sweatshirt -->
    <div class="hotspot" id="hotspot-sweatshirt" style="top: 50%; left: 30%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="Sweatshirt.png" alt="MetroSafe Sweatshirt" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Sweatshirt</div>
          <div class="popup-price">$40.00</div>
          <button class="add-to-cart" data-product="sweatshirt">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Mug -->
    <div class="hotspot" id="hotspot-mug" style="top: 60%; left: 22%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="mug.png" alt="MetroSafe Mug" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Mug</div>
          <div class="popup-price">$12.00</div>
          <button class="add-to-cart" data-product="mug">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Book -->
    <div class="hotspot" id="hotspot-book" style="top: 40%; left: 55%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="book-image-placeholder.png" alt="MetroSafe Book" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Notebook</div>
          <div class="popup-price">$15.00</div>
          <button class="add-to-cart" data-product="book">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Tote Bag -->
    <div class="hotspot" id="hotspot-tote" style="top: 85%; left: 60%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="totebag.png" alt="MetroSafe Tote Bag" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Tote Bag</div>
          <div class="popup-price">$18.00</div>
          <button class="add-to-cart" data-product="tote">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Phone Case -->
    <div class="hotspot" id="hotspot-phone" style="top: 50%; left: 85%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="phonecase.png" alt="MetroSafe Phone Case" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Phone Case</div>
          <div class="popup-price">$22.00</div>
          <button class="add-to-cart" data-product="phone">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Hat -->
    <div class="hotspot" id="hotspot-hat" style="top: 90%; left: 82%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="hat.png" alt="MetroSafe Hat" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Hat</div>
          <div class="popup-price">$20.00</div>
          <button class="add-to-cart" data-product="hat">Add to Cart</button>
        </div>
      </div>
    </div>
    <!-- Hotspot: MetroSafe Dog Tag -->
    <div class="hotspot" id="hotspot-dogtag" style="top: 85%; left: 5%;">
      <div class="marker">+</div>
      <div class="popup">
        <img src="dogtag.png" alt="MetroSafe Dog Tag" class="popup-img" />
        <div class="popup-text">
          <div class="popup-name">MetroSafe Dog Tag</div>
          <div class="popup-price">$8.00</div>
          <button class="add-to-cart" data-product="dogtag">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Toggle Button (fixed at top/right) -->
  <button class="cart-toggle">Cart (<span id="cart-count">0</span>)</button>

  <!-- Cart Sidebar Overlay (dark background when cart is open) -->
  <div class="cart-overlay"></div>

  <!-- Cart Sidebar Panel -->
  <aside class="cart-panel">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="cart-close">&times;</button>
    </div>
    <div class="cart-body">
      <div class="cart-items"><!-- items will be dynamically injected --></div>
      <div class="cart-empty">Your cart is empty.</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
      <button class="checkout-btn">Checkout</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
